---
description: Check compliance of Helm chart vs values.

parameters:
  chart_directory:
    type: string
    default: "./helm/chart"
    description: Unpackaged Helm chart directory.

  values_file:
    type: string
    default: ""
    description: Values file for the helm chart.

steps:
  - run:
      name: Lint Helm chart
      command: >-
        set -- "$@" --chart << parameters.chart_directory >>

        if [ -n "<< parameters.values_file >>" ]; then
          set -- "$@" --values << parameters.values_file >>
        fi

        noosinv helm.lint "$@"
